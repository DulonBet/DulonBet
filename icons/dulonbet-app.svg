<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<title>DulonBet — logo officiel</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1"><stop stop-color="#0717a8"/><stop offset=".38" stop-color="#064de5"/><stop offset=".7" stop-color="#063bba"/><stop offset="1" stop-color="#020b58"/></linearGradient>
 <radialGradient id="glow" cx=".5" cy=".42" r=".65"><stop stop-color="#18d9ff" stop-opacity=".95"/><stop offset=".45" stop-color="#087aff" stop-opacity=".35"/><stop offset="1" stop-color="#06115f" stop-opacity="0"/></radialGradient>
 <linearGradient id="white" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#fff"/><stop offset=".65" stop-color="#f4f8ff"/><stop offset="1" stop-color="#b8d7ff"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20f5ff"/><stop offset=".55" stop-color="#00c9f4"/><stop offset="1" stop-color="#008cff"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#087eff"/><stop offset="1" stop-color="#02094d"/></linearGradient>
 <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#00baff"/><stop offset=".5" stop-color="#e9ffff"/><stop offset="1" stop-color="#52e9ff"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="10"/><feComponentTransfer><feFuncA type="linear" slope=".7"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="clip"><rect width="1024" height="1024" rx="170"/></clipPath>
</defs>
<g clip-path="url(#clip)">
